# MySQL for CloudTrace plus the CLI.
#   docker compose up -d mysql
#   docker compose run --rm cloudtrace case-open --title "Incident 1" --investigator anish
#   docker compose run --rm cloudtrace import --case 1 --path /cases/sample/cloudtrail-incident.json
#   docker compose run --rm cloudtrace analyze --case 1
#   docker compose run --rm cloudtrace report --case 1 --out /cases/report.pdf
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: cloudtrace
      MYSQL_USER: cloudtrace
      MYSQL_PASSWORD: ${CLOUDTRACE_DB_PASSWORD:-cloudtrace}
    ports: ["3306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      retries: 20

  cloudtrace:
    build: .
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      CLOUDTRACE_DB_URL: jdbc:mysql://mysql:3306/cloudtrace?serverTimezone=UTC
      CLOUDTRACE_DB_USER: cloudtrace
      CLOUDTRACE_DB_PASSWORD: ${CLOUDTRACE_DB_PASSWORD:-cloudtrace}
      AWS_PROFILE: ${AWS_PROFILE:-default}
    volumes:
      - .:/cases
      - ~/.aws:/home/investigator/.aws:ro
    profiles: [cli]

volumes:
  mysqldata:
